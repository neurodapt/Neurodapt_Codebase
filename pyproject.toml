[project]
name = "major-project-research"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.13"
dependencies = [
    "accelerate==1.3.0",
    "bitsandbytes>=0.50.2",
    "compact-json>=1.8.2",
    "datasets==3.2.0",
    "dotenv>=0.9.9",
    "hf-xet>=1.5.2",
    "huggingface-hub>=0.36.2",
    "langchain>=1.3.2",
    "matplotlib>=3.11.1",
    "ollama>=0.6.2",
    "openai>=2.46.0",
    "peft==0.14.0",
    "scikit-learn",
    "sentence-transformers",
    "torch==2.5.1+cu124",
    "torchaudio==2.5.1+cu124",
    "torchvision==0.20.1+cu124",
    "tqdm>=4.66.0",
    "transformers==4.49.0",
    "trl==0.15.2",
    "websockets>=16.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
